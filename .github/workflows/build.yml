name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      with_flash_attn:
        description: "Компилировать flash-attn из исходников (долго)"
        type: boolean
        default: false
      with_pixal3d:
        description: "Ставить Pixal3D (компилирует natten из исходников, долго)"
        type: boolean
        default: false

# Два прогона на одной ветке гонятся за тегом latest, и запушить его последним
# может сборка СТАРОГО коммита — тогда latest молча откатывается назад.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Базовые CUDA-образы толстые, штатному раннеру места не хватает.
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Раннер: 4 ядра, 16 ГБ. На полном списке архитектур nvcc съедает
          # память и job умирает без сообщения прямо на сборке flex_gemm.
          # 8.6 покрывает A40/A6000/A5000/3090, 8.9 — 4090/L40S, PTX даёт
          # forward-совместимость с H100 через JIT.
          build-args: |
            WITH_FLASH_ATTN=${{ inputs.with_flash_attn && '1' || '0' }}
            WITH_PIXAL3D=${{ inputs.with_pixal3d && '1' || '0' }}
            TORCH_ARCH_LIST=8.6;8.9+PTX
            MAX_JOBS=2
            NATTEN_CUDA_ARCH=8.6
            NATTEN_N_WORKERS=2
          cache-from: type=gha
          cache-to: type=gha,mode=max
